<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <!-- inter, montserrat, hanuman, bebas neue -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Hanuman:wght@100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="w-360 mx-auto">
    <!-- hero section  -->
    <section class="bg-[url('./image/hero.png')] bg-cover h-193.25">
      <header class="flex justify-between items-center pt-7 px-30">
        <img src="./icon/logo.png" alt="pinetour-logo" class="w-25" />
        <nav class="flex gap-4">
          <p
            class="font-[Inter] text-white w-25 text-lg text-center font-semibold"
          >
            Home
          </p>
          <p
            class="font-[Inter] text-white w-25 text-lg text-center font-semibold"
          >
            About
          </p>
          <p
            class="font-[Inter] text-white w-25 text-lg text-center font-semibold"
          >
            Contact
          </p>
          <i data-lucide="user" color="white" stroke-width="3"></i>
        </nav>
        <div
          class="font-[Inter] uppercase flex justify-center items-center bg-white h-10 w-10 rounded-full text-sm"
        >
          en
        </div>
      </header>
      <div class="flex flex-col items-center pt-25">
        <p
          class="font-[Bebas_Neue] uppercase text-[80px] leading-none text-[rgba(232,237,242,0.72)] text-center"
        >
          pure magic
        </p>
        <p
          class="font-[Bebas_Neue] uppercase text-[250px] leading-none text-[rgba(253,253,254,0.98)]"
        >
          awaits!
        </p>
        <p
          class="font-[Hanuman] text-center font-black text-[rgba(255,255,255,0.8)] text-[64px]"
        >
          2024
        </p>
      </div>
    </section>
    <!-- location section  -->
    <section
      class="bg-[url('./image/location.png')] bg-cover h-125 flex justify-center items-center"
    >
      <div class="flex gap-10">
        <div
          class="w-70 h-93 rounded-3xl bg-[url('./image/terhiin-tsagaan.png')] bg-cover flex justify-center items-center drop-shadow-[8px_8px_0_rgba(41,114,139,0.25),-8px_-8px_0_rgba(31,114,170,0.46)] opacity-85 hover:bg-[linear-gradient(to_top,rgba(0,0,0,0.6),rgba(0,0,0,0.6)),url('./image/terhiin-tsagaan.png')]"
        >
          <p
            class="font-[Bebas_Neue] uppercase text-[rgba(253,253,254,0.8)] text-[37px] px-5 text-center text-shadow-lg/30"
          >
            terkhiin tsagaan lake
          </p>
        </div>
        <div
          class="w-70 h-93 rounded-3xl bg-[url('./image/amarbaysgalant.png')] bg-cover flex justify-center items-center drop-shadow-[8px_8px_0_rgba(41,114,139,0.25),-8px_-8px_0_rgba(31,114,170,0.46)] opacity-85 hover:bg-[linear-gradient(to_top,rgba(0,0,0,0.6),rgba(0,0,0,0.6)),url('./image/amarbaysgalant.png')]"
        >
          <p
            class="font-[Bebas_Neue] uppercase text-[rgba(253,253,254,0.8)] text-[37px] px-5 text-center text-shadow-lg/30"
          >
            amarbaysgalant monastery
          </p>
        </div>
        <div
          class="w-70 h-93 rounded-3xl bg-[url('./image/khuvsgul.png')] bg-cover flex justify-center items-center drop-shadow-[8px_8px_0_rgba(41,114,139,0.25),-8px_-8px_0_rgba(31,114,170,0.46)] opacity-85 hover:bg-[linear-gradient(to_top,rgba(0,0,0,0.6),rgba(0,0,0,0.6)),url('./image/khuvsgul.png')]"
        >
          <p
            class="font-[Bebas_Neue] uppercase text-[rgba(253,253,254,0.8)] text-[37px] px-5 text-center text-shadow-lg/30"
          >
            khuvsgul lake
          </p>
        </div>
        <div
          class="w-70 h-93 rounded-3xl bg-[url('./image/khorgiin-togoo.png')] bg-cover flex justify-center items-center drop-shadow-[8px_8px_0_rgba(41,114,139,0.25),-8px_-8px_0_rgba(31,114,170,0.46)] opacity-85 hover:bg-[linear-gradient(to_top,rgba(0,0,0,0.6),rgba(0,0,0,0.6)),url('./image/khorgiin-togoo.png')]"
        >
          <p
            class="font-[Bebas_Neue] uppercase text-[rgba(253,253,254,0.8)] text-[37px] px-5 text-center text-shadow-lg/30"
          >
            khorgiin togoo
          </p>
        </div>
      </div>
    </section>
    <!-- roadmap section  -->
    <section class="bg-[url('./image/roadmap.png')] bg-cover h-255.5">
      <div class="font-[Inter] text-center pt-30">
        <h1 class="text-[42px] font-semibold">Destination of Our Agency</h1>
        <p class="text-[20px] font-medium">Pack Your Bags And Get Ready</p>
      </div>
    </section>
    <!-- footer section  -->
    <footer class="bg-[url('./image/footer.png')] bg-cover h-280"></footer>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
